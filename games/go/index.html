<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f5f1" />
  <meta name="description" content="Playweft 围棋：黑白落子，围地提子，在方寸棋盘上步步较量。" />
  <title>围棋 | Playweft</title>
  <script type="module" src="./main.js"></script>
</head>

<body>
  <header class="game-header">
    <h1>围棋</h1>
  </header>

  <main class="go-layout">
    <dialog id="setup-panel" class="overlay-dialog setup-panel" aria-labelledby="setup-title">
      <form id="setup-form" class="overlay-dialog__surface setup-form" tabindex="-1">
        <header class="setup-heading">
          <h2 id="setup-title">对局设置</h2>
        </header>

        <div class="setup-content">
          <ul class="settings-list" role="list" aria-label="对局来源选项">
            <li class="setting-field">
              <span id="source-setting-label" class="setting-title">对局来源</span>
              <span class="setting-value" aria-hidden="true"></span>
              <i class="setting-chevron" data-lucide="chevron-right" aria-hidden="true"></i>
              <select id="source-setting" name="setupSource" aria-labelledby="source-setting-label">
                <option value="new">新对局</option>
                <option id="resume-source" value="resume">继续本地棋谱</option>
              </select>
            </li>
          </ul>

          <section id="resume-setup" class="resume-setup" aria-label="选择续下棋谱" hidden>
            <ul class="settings-list" role="list" aria-label="续棋选项">
              <li class="setting-field">
                <span id="resume-setting-label" class="setting-title">本地棋谱</span>
                <span class="setting-value" aria-hidden="true"></span>
                <i class="setting-chevron" data-lucide="chevron-right" aria-hidden="true"></i>
                <select id="resume-setting" name="resumeRecord" aria-labelledby="resume-setting-label"></select>
              </li>
            </ul>
            <dl id="resume-summary" class="resume-summary"></dl>
          </section>

          <ul id="new-game-settings" class="settings-list new-game-settings" role="list" aria-label="对局选项">
            <li class="setting-field">
              <span id="size-setting-label" class="setting-title">棋盘大小</span>
              <span class="setting-value" aria-hidden="true"></span>
              <i class="setting-chevron" data-lucide="chevron-right" aria-hidden="true"></i>
              <select id="size-setting" name="size" aria-labelledby="size-setting-label">
                <option value="9">9 × 9 · 快棋</option>
                <option value="13">13 × 13 · 中盘</option>
                <option value="19" selected>19 × 19 · 标准</option>
              </select>
            </li>
            <li class="settings-divider" role="presentation"><hr /></li>
            <li class="setting-field">
              <span id="rules-setting-label" class="setting-title">计分规则</span>
              <span class="setting-value" aria-hidden="true"></span>
              <i class="setting-chevron" data-lucide="chevron-right" aria-hidden="true"></i>
              <select id="rules-setting" name="rules" aria-labelledby="rules-setting-label">
                <option value="chinese" data-display="中国规则">中国规则 · 子与地</option>
                <option value="japanese" data-display="日本规则">日本规则 · 地与提子</option>
              </select>
            </li>
            <li class="settings-divider" role="presentation"><hr /></li>
            <li class="setting-field">
              <label for="komi-setting" class="setting-title">贴目</label>
              <span class="number-input">
                <input id="komi-setting" name="komi" type="number" min="0" max="20" step="0.5" value="6.5" />
                <span>目</span>
              </span>
            </li>
            <li class="settings-divider" role="presentation"><hr /></li>
            <li class="setting-field">
              <span id="black-setting-label" class="setting-title">执黑方式</span>
              <span class="setting-value" aria-hidden="true"></span>
              <i class="setting-chevron" data-lucide="chevron-right" aria-hidden="true"></i>
              <select id="black-setting" name="blackMode" aria-labelledby="black-setting-label">
                <option value="random">随机执黑</option>
                <option value="player1">玩家 1 执黑</option>
                <option value="player2">玩家 2 执黑</option>
              </select>
            </li>
            <li class="settings-divider" role="presentation"><hr /></li>
            <li class="setting-field">
              <span id="handicap-setting-label" class="setting-title">让子</span>
              <span class="setting-value" aria-hidden="true"></span>
              <i class="setting-chevron" data-lucide="chevron-right" aria-hidden="true"></i>
              <select id="handicap-setting" name="handicap" aria-labelledby="handicap-setting-label">
                <option value="0">不让子</option>
                <option value="2">让 2 子</option>
                <option value="3">让 3 子</option>
                <option value="4">让 4 子</option>
                <option value="5">让 5 子</option>
                <option value="6">让 6 子</option>
                <option value="7">让 7 子</option>
                <option value="8">让 8 子</option>
                <option value="9">让 9 子</option>
              </select>
            </li>
          </ul>
          <p id="setup-note" class="setup-note">房主确认设置后开始</p>
          <p id="handicap-note" class="handicap-note">
            让子时受让方固定执黑，摆好让子后由白方先行。
          </p>
          <p id="setup-feedback" class="setup-feedback" role="status" aria-live="polite" hidden></p>
        </div>

        <footer class="setup-actions">
          <button id="start-button" class="start-action" type="submit">
            <span id="start-label">开始对局</span>
          </button>
        </footer>
      </form>
    </dialog>

    <dialog id="history-panel" class="overlay-dialog history-panel" aria-labelledby="history-title">
      <div id="history-dialog" class="overlay-dialog__surface history-dialog" tabindex="-1">
        <header class="overlay-dialog__header">
          <h2 id="history-title">本地棋谱</h2>
          <button id="history-close" class="overlay-dialog__close" type="button" aria-label="关闭棋谱">
            <i data-lucide="x"></i>
          </button>
        </header>
        <ul id="history-list" class="history-list"></ul>
        <footer class="history-footer">
          <button id="history-clear" class="history-clear" type="button">
            <i data-lucide="trash-2"></i>
            <span id="history-clear-label">清空全部</span>
          </button>
        </footer>
      </div>
    </dialog>

    <dialog id="game-info-panel" class="overlay-dialog overlay-dialog--sheet-narrow game-info-panel"
      aria-labelledby="game-info-title">
      <div id="game-info-dialog" class="overlay-dialog__surface game-info-dialog" tabindex="-1">
        <header class="overlay-dialog__header">
          <h2 id="game-info-title">对局信息</h2>
          <button id="game-info-close" class="overlay-dialog__close" type="button" aria-label="关闭对局信息">
            <i data-lucide="x"></i>
          </button>
        </header>
        <dl id="game-info-list" class="game-info-list"></dl>
      </div>
    </dialog>

    <section id="table-layout" class="table-layout">
      <aside id="black-player" class="player-station is-current" aria-label="黑方玩家">
        <div class="player-card">
          <span class="go-stone go-stone--black stone-swatch" aria-hidden="true"></span>
          <div class="player-info">
            <strong class="player-name" data-player-name>黑方</strong>
            <span class="player-detail" data-player-detail>提子 0</span>
          </div>
        </div>
        <span class="clock-housing">
          <time class="player-time" data-player-time datetime="PT0S">00:00</time>
        </span>
      </aside>

      <aside id="white-player" class="player-station" aria-label="白方玩家">
        <div class="player-card">
          <span class="go-stone go-stone--white stone-swatch" aria-hidden="true"></span>
          <div class="player-info">
            <strong class="player-name" data-player-name>白方</strong>
            <span class="player-detail" data-player-detail>提子 0</span>
          </div>
        </div>
        <span class="clock-housing">
          <time class="player-time" data-player-time datetime="PT0S">00:00</time>
        </span>
      </aside>

      <section class="board-shell" aria-label="19 × 19 围棋棋盘">
        <div id="board" class="go-board" role="grid"></div>
      </section>
    </section>

    <aside class="action-panel">
      <div class="sidebar-move-number" data-move-number hidden>开局</div>
      <p id="action-feedback" class="action-feedback" role="status" hidden></p>
      <p id="scoring-summary" class="scoring-summary" hidden></p>
      <section class="move-log" aria-labelledby="move-log-title">
        <header class="move-log-heading">
          <h2 id="move-log-title">落子记录</h2>
          <div class="move-log-heading-actions">
            <span id="move-log-count">0 手</span>
            <button id="replay-button" class="move-log-replay" type="button" aria-expanded="false"
              aria-controls="replay-controls" disabled>
              <i data-lucide="history"></i>回看
            </button>
          </div>
        </header>
        <ol id="move-log-list" class="move-log-list">
          <li class="move-log-empty">尚未落子</li>
        </ol>
        <section id="replay-controls" class="replay-controls" aria-label="对局回看" hidden>
          <div class="replay-scrubber">
            <button id="replay-first" type="button" aria-label="回到开局" title="回到开局">
              <i data-lucide="chevrons-left"></i>
            </button>
            <button id="replay-previous" type="button" aria-label="上一手" title="上一手">
              <i data-lucide="chevron-left"></i>
            </button>
            <div id="replay-slider-field" class="replay-slider-field">
              <div class="replay-status-track" aria-hidden="true">
                <output id="replay-status" class="replay-status" for="replay-slider">0</output>
              </div>
              <input id="replay-slider" type="range" min="0" max="0" value="0" step="1"
                aria-label="回看进度" />
            </div>
            <button id="replay-next" type="button" aria-label="下一手" title="下一手">
              <i data-lucide="chevron-right"></i>
            </button>
            <button id="replay-last" type="button" aria-label="回到最新" title="回到最新">
              <i data-lucide="chevrons-right"></i>
            </button>
          </div>
        </section>
      </section>
      <section id="undo-request" class="undo-request" aria-live="polite" hidden>
        <p id="undo-request-label">对方请求悔棋</p>
        <div id="undo-response-actions" class="undo-response-actions">
          <button id="undo-reject" type="button">拒绝</button>
          <button id="undo-accept" type="button">同意</button>
        </div>
      </section>
      <div class="turn-actions">
        <button id="undo-button" class="undo-action" type="button" disabled>
          <span class="icon-button-content"><i data-lucide="undo-2"></i><span id="undo-label">悔棋</span></span>
        </button>
        <button id="pass-button" class="pass-action" type="button" disabled>
          <span class="icon-button-content"><i data-lucide="flag"></i>停一手</span>
        </button>
        <button id="more-button" class="round-icon-button more-action" type="button" aria-label="更多操作" aria-haspopup="menu"
          aria-expanded="false" aria-controls="more-menu">
          <i data-lucide="ellipsis"></i>
        </button>
        <div id="more-menu" class="more-menu" role="menu" aria-label="更多操作" hidden>
          <button id="game-info-button" class="more-menu-item" type="button" role="menuitem">
            <i data-lucide="info"></i><span>对局信息</span>
          </button>
          <button id="history-button" class="more-menu-item" type="button" role="menuitem">
            <i data-lucide="notebook-pen"></i><span>本地棋谱</span>
          </button>
          <a id="help-link" class="more-menu-item" href="./help.html" target="_blank" rel="noopener" role="menuitem">
            <i data-lucide="circle-help"></i><span>玩法与计分</span>
          </a>
          <button id="resign-button" class="more-menu-item is-danger" type="button" role="menuitem" disabled>
            <i data-lucide="flag"></i><span id="resign-label">认输</span>
          </button>
        </div>
      </div>
      <button id="rematch-button" class="rematch-action" type="button" hidden>
        <span class="icon-button-content"><i data-lucide="rotate-ccw"></i>再来一局</span>
      </button>
      <button id="settings-button" class="settings-action" type="button" hidden>
        <span class="icon-button-content"><i data-lucide="settings-2"></i>返回设置</span>
      </button>
    </aside>
  </main>
  <button id="confirm-move" class="confirm-move" type="button" hidden>
    落子
  </button>
</body>

</html>
