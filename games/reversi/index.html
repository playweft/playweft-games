<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#302e2b" />
  <meta name="description" content="Playweft 黑白棋：夹住对方棋子并翻转，终局时棋子更多的一方获胜。" />
  <title>黑白棋 | Playweft</title>
  <script type="module" src="./main.js"></script>
</head>
<body>
  <header class="game-header">
    <h1>黑白棋</h1>
    <a id="help-button" class="round-icon-button reversi-help-button" href="./help.html" target="_blank" rel="noopener"
      aria-label="帮助（在新窗口打开）" title="帮助" hidden><i data-lucide="circle-help" aria-hidden="true"></i></a>
  </header>
  <main class="reversi-layout">
    <section class="scoreboard" aria-label="棋子数量">
      <div id="black-player" class="player-card">
        <span class="reversi-swatch" data-piece="1" aria-hidden="true"></span>
        <div><strong>黑方</strong><span id="black-name" class="player-name">玩家 1</span></div>
        <output id="black-count" aria-label="黑棋数量">2</output>
      </div>
      <div id="white-player" class="player-card">
        <span class="reversi-swatch" data-piece="2" aria-hidden="true"></span>
        <div><strong>白方</strong><span id="white-name" class="player-name">玩家 2</span></div>
        <output id="white-count" aria-label="白棋数量">2</output>
      </div>
      <button id="settings-button" class="round-icon-button" type="button" aria-label="对局设置" aria-haspopup="dialog" aria-controls="setup-dialog" hidden><i data-lucide="settings" aria-hidden="true"></i></button>
    </section>
    <section class="board-stage" aria-label="对弈区">
      <div id="board-view" class="reversi-board">
        <canvas id="board-static" aria-hidden="true"></canvas>
        <canvas id="board-animation" aria-hidden="true"></canvas>
        <div id="board" class="board-input" role="grid" aria-label="8 × 8 黑白棋棋盘"></div>
      </div>
    </section>
    <nav id="game-actions" class="game-actions" aria-label="对局操作" hidden>
      <button id="rematch-button" type="button" hidden><i data-lucide="rotate-ccw" aria-hidden="true"></i>再来一局</button>
    </nav>
  </main>
  <p id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
  <dialog id="setup-dialog" class="overlay-dialog overlay-dialog--sheet-narrow" aria-labelledby="setup-title">
    <form id="setup-form" class="overlay-dialog__surface setup-form" tabindex="-1">
      <header class="overlay-dialog__header setup-heading">
        <h2 id="setup-title">对局设置</h2>
        <button id="setup-close" class="round-icon-button" type="button" aria-label="关闭设置"><i data-lucide="x" aria-hidden="true"></i></button>
      </header>
      <div class="setup-content">
        <ul class="settings-list" aria-label="对局选项">
          <li class="setting-field">
            <span id="opponent-label" class="setting-title">对战方式</span>
            <span id="opponent-value" class="setting-value" aria-hidden="true">人机对战</span>
            <i class="setting-chevron" data-lucide="chevron-right" aria-hidden="true"></i>
            <select id="opponent-setting" aria-labelledby="opponent-label"><option value="ai">人机对战</option><option value="local">本地双人</option></select>
          </li>
          <li id="side-divider" class="settings-divider" role="presentation"><hr /></li>
          <li id="side-field" class="setting-field">
            <span id="side-label" class="setting-title">你的执子</span>
            <span id="side-value" class="setting-value" aria-hidden="true">执黑先行</span>
            <i class="setting-chevron" data-lucide="chevron-right" aria-hidden="true"></i>
            <select id="side-setting" aria-labelledby="side-label"><option value="1">执黑先行</option><option value="2">执白后行</option></select>
          </li>
        </ul>
      </div>
      <footer class="setup-actions"><button id="start-button" type="submit">开始对局</button></footer>
    </form>
  </dialog>
</body>
</html>
